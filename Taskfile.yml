version: '3'

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list-all

  build:
    desc: Build the application locally
    cmds:
      - cargo build --release

  run:
    desc: Run the application locally
    cmds:
      - cargo run -- {{.CLI_ARGS}}

  test:
    desc: Run unit and integration tests
    cmds:
      - cargo test

  fmt:
    desc: Format the Rust code
    cmds:
      - cargo fmt

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker compose build

  docker:up:
    desc: Start the Docker container in the background
    cmds:
      - docker compose up -d

  docker:down:
    desc: Stop and remove the Docker container
    cmds:
      - docker compose down

  docker:shell:
    desc: Enter the running Docker container via bash
    cmds:
      - docker compose exec aig bash
